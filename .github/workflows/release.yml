# Release pipeline for the RSL Companion Account Data Extractor.
#
# Trigger: push a tag like v1.2.0 (or run manually with a version input).
# Output:  a GitHub Release with the versioned installer + its SHA-256 checksum.
#
# The stable download URL (get.rslcompanion.com/RslCompanionAccountDataExtractor-Setup.exe)
# should redirect to the versioned asset of the latest release.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.2.0)"
        required: true

permissions:
  contents: write # create the GitHub Release
  id-token: write # required to mint the build-provenance attestation
  attestations: write # publish the build-provenance attestation

jobs:
  release:
    runs-on: windows-latest

    steps:
      # EXTRACTION_REPO_TOKEN: fine-grained PAT with read access to the private
      # RslCompanionExtraction repo, so the extraction/ submodule can be fetched. Official
      # releases must include the engine; without this secret the build would silently
      # produce an upload-only binary.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.EXTRACTION_REPO_TOKEN }}

      # Fail fast with a human-readable message if the extraction gitlink points at a commit
      # that was never pushed to the private RslCompanionExtraction repo. Letting the recursive
      # submodule fetch discover this instead dies with a cryptic "upload-pack: not our ref"
      # exit 128 (v1.5.2 post-mortem: the engine was committed into the gitlink but not pushed).
      - name: Verify extraction submodule commit is pushed
        shell: pwsh
        run: |
          $sha = (git ls-tree HEAD extraction).Split()[2]
          Write-Host "Extraction gitlink pinned to $sha"
          $url = "https://x-access-token:${{ secrets.EXTRACTION_REPO_TOKEN }}@github.com/rslcompanion/RslCompanionExtraction.git"
          git fetch --depth 1 $url $sha 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Extraction commit $sha is not on the remote — it was committed into the gitlink but never pushed to the private extraction repo. Push the engine first (git -C extraction push origin main), then re-run this release."
          }
          Write-Host "OK: commit is present on the extraction remote."

      # Now that the commit is known-reachable, do the actual (recursive) submodule checkout.
      # Auth is supplied inline so it does not depend on checkout's credential injection.
      - name: Check out extraction submodule
        shell: pwsh
        run: |
          git -c url."https://x-access-token:${{ secrets.EXTRACTION_REPO_TOKEN }}@github.com/".insteadOf="https://github.com/" submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) { throw "Submodule checkout failed." }

      - name: Ensure extraction engine is present
        shell: pwsh
        run: |
          if (-not (Test-Path "extraction\RslCompanion.Extraction.csproj")) {
            throw "extraction/ submodule missing — check EXTRACTION_REPO_TOKEN."
          }

      - name: Derive version
        id: ver
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ inputs.version }}'
          } else {
            '${{ github.ref_name }}'.TrimStart('v')
          }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Version '$v' is not in X.Y.Z form." }
          "version=$v" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained build
        shell: pwsh
        # Multi-file self-contained (no PublishSingleFile): Inno packs the whole folder anyway, and
        # avoiding the single-file self-extraction-to-temp pattern reduces AV "dropper" heuristic
        # flags and speeds startup.
        run: >
          dotnet publish RslCompanionUploader.csproj -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish\win-x64

      # Whether code signing runs is gated on the Azure Trusted Signing secrets being configured, so
      # releases still build (unsigned) until a signing identity exists.
      - name: Check signing config
        id: signcfg
        shell: pwsh
        run: |
          $enabled = -not [string]::IsNullOrEmpty('${{ secrets.AZURE_CLIENT_ID }}')
          "enabled=$enabled" >> $env:GITHUB_OUTPUT
          Write-Host "Code signing enabled: $enabled"

      # Sign the app exe BEFORE Inno packs it, so antivirus scanning the installed/extracted exe
      # sees a valid signature.
      - name: Sign application exe
        if: steps.signcfg.outputs.enabled == 'True'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\publish\win-x64\RslCompanionUploader.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # --- MSIX (sideload) packaging: a second, independent artifact built from the same publish
      # output. Signed with a persistent self-signed cert (not Trusted Signing) until this is
      # either submitted to the Store (which signs for free) or a paid cert is worth the cost.
      - name: Assemble MSIX layout
        shell: pwsh
        run: |
          $layout = "msix-layout"
          New-Item -ItemType Directory -Force -Path $layout | Out-Null
          Copy-Item "publish\win-x64\*" $layout -Recurse -Force
          Copy-Item "Package\Assets" "$layout\Assets" -Recurse -Force

          [xml]$manifest = Get-Content "Package\Package.appxmanifest"
          $manifest.Package.Identity.Version = "${{ steps.ver.outputs.version }}.0"
          $manifest.Save("$PWD\$layout\AppxManifest.xml")

      # Whether MSIX signing runs is gated on the self-signed cert secrets being configured (see
      # Package/Package.appxmanifest's header comment for how to generate one), same soft-gate
      # style as the Azure Trusted Signing check above.
      - name: Check MSIX signing config
        id: msixsigncfg
        shell: pwsh
        run: |
          $enabled = -not [string]::IsNullOrEmpty('${{ secrets.MSIX_SIGNING_CERT_PFX_BASE64 }}')
          "enabled=$enabled" >> $env:GITHUB_OUTPUT
          Write-Host "MSIX signing enabled: $enabled"

      - name: Pack MSIX
        shell: pwsh
        run: |
          $sdkBin = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
            Sort-Object Name -Descending | Select-Object -First 1
          $makeappx = Join-Path $sdkBin.FullName "x64\makeappx.exe"

          New-Item -ItemType Directory -Force -Path "installer\dist" | Out-Null
          & $makeappx pack /d msix-layout /p "installer\dist\RslCompanionAccountDataExtractor-${{ steps.ver.outputs.version }}.msix" /overwrite
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed with exit code $LASTEXITCODE" }

      - name: Sign MSIX
        if: steps.msixsigncfg.outputs.enabled == 'True'
        shell: pwsh
        run: |
          $sdkBin = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
            Sort-Object Name -Descending | Select-Object -First 1
          $signtool = Join-Path $sdkBin.FullName "x64\signtool.exe"

          $pfxPath = Join-Path $env:RUNNER_TEMP "msix-signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String('${{ secrets.MSIX_SIGNING_CERT_PFX_BASE64 }}'))
          try {
            & $signtool sign /fd SHA256 /f $pfxPath /p '${{ secrets.MSIX_CERT_PASSWORD }}' /tr http://timestamp.acs.microsoft.com /td SHA256 "installer\dist\RslCompanionAccountDataExtractor-${{ steps.ver.outputs.version }}.msix"
            if ($LASTEXITCODE -ne 0) { throw "signtool failed with exit code $LASTEXITCODE" }
          } finally {
            Remove-Item -Force $pfxPath -ErrorAction SilentlyContinue
          }

      - name: Version MSIX artifact and generate SHA-256 checksum
        id: msixart
        shell: pwsh
        run: |
          $version = '${{ steps.ver.outputs.version }}'
          $name = "RslCompanionAccountDataExtractor-$version.msix"
          $hash = (Get-FileHash "installer\dist\$name" -Algorithm SHA256).Hash.ToLower()
          "$hash *$name" | Out-File -Encoding ascii "installer\dist\$name.sha256"

          # Stable, unversioned copy mirroring the installer's pattern above.
          $stableName = "RslCompanionAccountDataExtractor.msix"
          Copy-Item "installer\dist\$name" "installer\dist\$stableName"
          "$hash *$stableName" | Out-File -Encoding ascii "installer\dist\$stableName.sha256"

          "sha256=$hash" >> $env:GITHUB_OUTPUT

      # Package\rsl-msix.cer (public key only) lets testers import-trust the signing cert once.
      # Not present until the cert has been generated locally — see Package.appxmanifest's header.
      - name: Include MSIX signing certificate for sideload trust
        shell: pwsh
        run: |
          if (Test-Path "Package\rsl-msix.cer") {
            Copy-Item "Package\rsl-msix.cer" "installer\dist\rsl-msix.cer"
          } else {
            Write-Host "Package\rsl-msix.cer not present — skipping (no cert for testers to trust yet)."
          }

      - name: Compile installer
        shell: pwsh
        run: |
          # Inno Setup 6 is preinstalled on GitHub's Windows runner images; install it if missing.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc /DMyAppVersion=${{ steps.ver.outputs.version }} installer\setup.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      # Sign the finished installer — this is the file SmartScreen checks on download. Must run
      # BEFORE the checksum step so the published SHA-256 matches the signed binary users receive.
      - name: Sign installer
        if: steps.signcfg.outputs.enabled == 'True'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\installer\dist\RslCompanionAccountDataExtractor-Setup.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Version the artifact and generate SHA-256 checksum
        id: art
        shell: pwsh
        run: |
          $version = '${{ steps.ver.outputs.version }}'
          $name = "RslCompanionAccountDataExtractor-Setup-$version.exe"
          Move-Item "installer\dist\RslCompanionAccountDataExtractor-Setup.exe" "installer\dist\$name"

          $hash = (Get-FileHash "installer\dist\$name" -Algorithm SHA256).Hash.ToLower()
          # sha256sum-compatible format so users can verify with any standard tool.
          "$hash *$name" | Out-File -Encoding ascii "installer\dist\$name.sha256"

          # Stable, unversioned copy so get.rslcompanion.com can redirect to GitHub's
          # built-in /releases/latest/download/<name> URL instead of a Cloudflare Worker.
          $stableName = "RslCompanionAccountDataExtractor-Setup.exe"
          Copy-Item "installer\dist\$name" "installer\dist\$stableName"
          "$hash *$stableName" | Out-File -Encoding ascii "installer\dist\$stableName.sha256"

          "sha256=$hash" >> $env:GITHUB_OUTPUT
          Get-Content "installer\dist\$name.sha256"

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            installer/dist/RslCompanionAccountDataExtractor-Setup-*.exe
            installer/dist/RslCompanionAccountDataExtractor-*.msix

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            installer/dist/RslCompanionAccountDataExtractor-Setup-*.exe
            installer/dist/RslCompanionAccountDataExtractor-Setup.exe
            installer/dist/RslCompanionAccountDataExtractor-*.msix
            installer/dist/RslCompanionAccountDataExtractor.msix
            installer/dist/*.sha256
            installer/dist/*.cer
          body: |
            **SHA-256 (installer):** `${{ steps.art.outputs.sha256 }}`
            **SHA-256 (MSIX):** `${{ steps.msixart.outputs.sha256 }}`

            Verify your download (PowerShell):
            ```
            Get-FileHash RslCompanionAccountDataExtractor-Setup-${{ steps.ver.outputs.version }}.exe -Algorithm SHA256
            Get-FileHash RslCompanionAccountDataExtractor-${{ steps.ver.outputs.version }}.msix -Algorithm SHA256
            ```

            **Verify this build came from this repo's source** (requires the [GitHub CLI](https://cli.github.com)):
            ```
            gh attestation verify RslCompanionAccountDataExtractor-Setup-${{ steps.ver.outputs.version }}.exe -R rslcompanion/RslCompanionUploader
            ```
            This checks a signed attestation tying the exe's hash to this exact GitHub Actions run and commit — proof the binary wasn't tampered with after the build, even though the extraction engine's source is private.

            **Sideload (.msix):** this is a direct-install alternative to the installer above, ahead
            of an eventual Microsoft Store listing. It's signed with a self-signed certificate (not
            yet a paid/CA-trusted one), so Windows won't trust it out of the box. One-time setup per
            machine: download `rsl-msix.cer` from this release and import it before installing the
            `.msix`:
            ```
            Import-Certificate -FilePath rsl-msix.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople
            ```
            (run from an elevated PowerShell prompt). After that, double-click the `.msix` to install.
